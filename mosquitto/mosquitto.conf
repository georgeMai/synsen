# Mosquitto 2.x – file được sinh bởi docker-compose (xem lệnh khởi động trong service mosquitto)
# Nếu MQTT_PASSWORD trống: cho phép kết nối ẩn danh (chỉ dùng trong mạng LAN khi demo).
# Nếu có MQTT_PASSWORD: bắt buộc username/password (dùng khi mở cổng 1883 ra Internet).
listener 1883
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
