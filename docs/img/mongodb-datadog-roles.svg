<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Inter, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="760" height="560" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">MongoDB lưu và tính, Datadog quan sát và cảnh báo ở mọi giai đoạn</text><text x="154" y="78" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Datadog – quan sát, cảnh báo</text><text x="380" y="78" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Giai đoạn</text><text x="606" y="78" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">MongoDB – lưu, tính toán</text><rect x="24" y="96" width="260" height="72" rx="8" fill="white" stroke="#8a8f98" stroke-width="1.25"/><rect x="476" y="96" width="260" height="72" rx="8" fill="white" stroke="#8a8f98" stroke-width="1.25"/><rect x="300" y="96" width="160" height="72" rx="8" fill="#e8f0fd" stroke="#2f6fdf" stroke-width="2"/><line x1="284" y1="132" x2="300" y2="132" stroke="#8a8f98" stroke-width="1.25"/><line x1="460" y1="132" x2="476" y2="132" stroke="#8a8f98" stroke-width="1.25"/><path d="M380 168V188" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#a)"/><text x="380" y="128" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">1. Thu thập</text><text x="380" y="146" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">mỗi 5 giây</text><text x="36" y="118" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">DogStatsD: cảm biến, bơm, lưu lượng</text><text x="36" y="136" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">log JSON và APM trace của backend</text><text x="36" y="154" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">http/tcp check backend, broker 15 s</text><text x="488" y="118" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">telemetry: time series, TTL 30 ngày</text><text x="488" y="136" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">devices: trạng thái mới nhất</text><text x="488" y="154" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">index device_id + ts</text><rect x="24" y="188" width="260" height="72" rx="8" fill="white" stroke="#8a8f98" stroke-width="1.25"/><rect x="476" y="188" width="260" height="72" rx="8" fill="white" stroke="#8a8f98" stroke-width="1.25"/><rect x="300" y="188" width="160" height="72" rx="8" fill="#e8f0fd" stroke="#2f6fdf" stroke-width="2"/><line x1="284" y1="224" x2="300" y2="224" stroke="#8a8f98" stroke-width="1.25"/><line x1="460" y1="224" x2="476" y2="224" stroke="#8a8f98" stroke-width="1.25"/><path d="M380 260V280" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#a)"/><text x="380" y="220" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">2. Phát hiện</text><text x="380" y="238" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">3 lớp độc lập</text><text x="36" y="210" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">34 monitor: metric, log, RUM, check</text><text x="36" y="228" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">anomalies() và forecast()</text><text x="36" y="246" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">webhook mở hoặc gộp sự cố</text><text x="488" y="210" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">incidents: 1 sự cố mở mỗi loại</text><text x="488" y="228" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">irrigation_events: z-score %/L</text><text x="488" y="246" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">settings: ngưỡng sửa trên web</text><rect x="24" y="280" width="260" height="72" rx="8" fill="white" stroke="#8a8f98" stroke-width="1.25"/><rect x="476" y="280" width="260" height="72" rx="8" fill="white" stroke="#8a8f98" stroke-width="1.25"/><rect x="300" y="280" width="160" height="72" rx="8" fill="#e8f0fd" stroke="#2f6fdf" stroke-width="2"/><line x1="284" y1="316" x2="300" y2="316" stroke="#8a8f98" stroke-width="1.25"/><line x1="460" y1="316" x2="476" y2="316" stroke="#8a8f98" stroke-width="1.25"/><path d="M380 352V372" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#a)"/><text x="380" y="312" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">3. Điều tra</text><text x="380" y="330" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">vì sao xảy ra</text><text x="36" y="302" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">metric theo cause, RSSI trước khi rớt</text><text x="36" y="320" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">log có trace_id, mở thẳng trace</text><text x="36" y="338" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">RUM: cú bấm nối tới trace backend</text><text x="488" y="302" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">events: reconnected, pump_run</text><text x="488" y="320" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">timeline sự cố: chẩn đoán, ghi chú</text><text x="488" y="338" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">commands, ack, audit_log</text><rect x="24" y="372" width="260" height="72" rx="8" fill="white" stroke="#8a8f98" stroke-width="1.25"/><rect x="476" y="372" width="260" height="72" rx="8" fill="white" stroke="#8a8f98" stroke-width="1.25"/><rect x="300" y="372" width="160" height="72" rx="8" fill="#e8f0fd" stroke="#2f6fdf" stroke-width="2"/><line x1="284" y1="408" x2="300" y2="408" stroke="#8a8f98" stroke-width="1.25"/><line x1="460" y1="408" x2="476" y2="408" stroke="#8a8f98" stroke-width="1.25"/><path d="M380 444V464" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#a)"/><text x="380" y="404" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">4. Phản ứng</text><text x="380" y="422" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">chứng minh đã sửa</text><text x="36" y="394" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">monitor về OK, MTTD và MTTR</text><text x="36" y="412" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">2 SLO kèm error budget</text><text x="36" y="430" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">bắt việc báo đã sửa khi chưa sửa</text><text x="488" y="394" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">kết quả kiểm chứng trong sự cố</text><text x="488" y="412" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">mttd_s, mttr_s lưu vĩnh viễn</text><text x="488" y="430" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">lần tưới thử phải đạt normal</text><rect x="24" y="464" width="260" height="72" rx="8" fill="white" stroke="#8a8f98" stroke-width="1.25"/><rect x="476" y="464" width="260" height="72" rx="8" fill="white" stroke="#8a8f98" stroke-width="1.25"/><rect x="300" y="464" width="160" height="72" rx="8" fill="#e8f0fd" stroke="#2f6fdf" stroke-width="2"/><line x1="284" y1="500" x2="300" y2="500" stroke="#8a8f98" stroke-width="1.25"/><line x1="460" y1="500" x2="476" y2="500" stroke="#8a8f98" stroke-width="1.25"/><text x="380" y="496" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">5. Học và dự báo</text><text x="380" y="514" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">AI tưới</text><text x="36" y="486" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">ml.forecast_mae, skill, tuổi mô hình</text><text x="36" y="504" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">monitor AI kém tin cậy hoặc cũ</text><text x="36" y="522" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">nguy cơ thiếu nước, stress nhiệt</text><text x="488" y="486" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">4 aggregation pipeline</text><text x="488" y="504" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">Change Stream kích hoạt học lại</text><text x="488" y="522" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">models, forecasts (TTL 3 ngày)</text></svg>